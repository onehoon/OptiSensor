name: App CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    name: Build, test, and publish smoke
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore tests
        shell: pwsh
        run: |
          dotnet restore .\tests\OptiSensor.Tests\OptiSensor.Tests.csproj `
            --force-evaluate `
            --no-http-cache

      - name: Show resolved LibreHardwareMonitor version
        id: libre
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assetsPath = ".\src\OptiSensor\obj\project.assets.json"
          if (-not (Test-Path $assetsPath)) {
            throw "OptiSensor project.assets.json was not produced by restore."
          }

          $assets = Get-Content $assetsPath -Raw | ConvertFrom-Json
          $resolved = $assets.libraries.PSObject.Properties.Name |
            Where-Object { $_ -like "LibreHardwareMonitorLib/*" } |
            Select-Object -First 1
          if (-not $resolved) {
            throw "LibreHardwareMonitorLib was not found in project.assets.json."
          }

          $version = $resolved.Substring("LibreHardwareMonitorLib/".Length)
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved $resolved"

      - name: Build tests (Release)
        run: dotnet build .\tests\OptiSensor.Tests\OptiSensor.Tests.csproj -c Release --no-restore

      - name: Run tests (Release)
        run: |
          dotnet test .\tests\OptiSensor.Tests\OptiSensor.Tests.csproj `
            -c Release `
            --no-build `
            --logger "trx;LogFileName=OptiSensor.Tests.trx" `
            --results-directory .\.artifacts\test-results

      - name: Publish smoke (single-file, no release/tag/asset)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish .\src\OptiSensor\OptiSensor.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=false `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o .\.artifacts\publish-smoke

          if (-not (Test-Path ".\.artifacts\publish-smoke\OptiSensor.exe")) {
            throw "OptiSensor.exe was not produced by publish smoke."
          }

      - name: Write successful Libre build marker
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".ci-state" | Out-Null
          Set-Content `
            -Path ".ci-state/libre-built.txt" `
            -Value "${{ steps.libre.outputs.version }}" `
            -NoNewline

      - name: Record successful Libre build
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .ci-state/libre-built.txt
          key: optisensor-libre-built-${{ steps.libre.outputs.version }}
