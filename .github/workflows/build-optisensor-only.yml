name: Build OptiSensor Only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OptiSensor
    runs-on: windows-latest

    steps:
      - name: Checkout OptiSensor
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Determine next OptiSensor version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --tags --force
          $patches = git tag -l "v0.1.*" | ForEach-Object {
            if ($_ -match '^v0\.1\.(\d+)$') { [int]$Matches[1] }
          }
          $nextPatch = if ($patches) { (($patches | Measure-Object -Maximum).Maximum + 1) } else { 1 }
          $version = "0.1.$nextPatch"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "OptiSensor version: $version"

      - name: Publish and package both editions
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $workspace = $env:GITHUB_WORKSPACE
          $releaseDir = Join-Path $workspace ".artifacts/release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          # One repository-wide version, published to both Velopack channels within a
          # single GitHub Release so neither edition's update feed depends on the other
          # edition having released within the last 10 GitHub Releases.
          $editions = @(
            [pscustomobject]@{ SourceRef = "main"; Channel = "win";  Title = "Desktop" },
            [pscustomobject]@{ SourceRef = "claw"; Channel = "claw"; Title = "Claw" }
          )

          git fetch origin main claw --force

          dotnet tool install vpk --tool-path .tools --version 1.2.0

          foreach ($edition in $editions) {
            Write-Host "::group::Package $($edition.Title) ($($edition.SourceRef) -> channel $($edition.Channel))"

            $work = Join-Path $workspace ".editions/$($edition.Channel)"
            if (Test-Path $work) { git worktree remove --force $work }
            git worktree add --force $work "origin/$($edition.SourceRef)"

            $commit = (git -C $work rev-parse HEAD).Trim()
            Write-Host "Edition: $($edition.Title)"
            Write-Host "Source ref: $($edition.SourceRef)"
            Write-Host "Channel: $($edition.Channel)"
            Write-Host "Version: $version"
            Write-Host "Commit: $commit"

            $proj = Join-Path $work "src/OptiSensor/OptiSensor.csproj"
            $publishDir = Join-Path $workspace ".artifacts/publish/$($edition.Channel)"

            dotnet restore $proj --force-evaluate --no-http-cache

            $assetsPath = Join-Path $work "src/OptiSensor/obj/project.assets.json"
            if (-not (Test-Path $assetsPath)) {
              throw "OptiSensor project.assets.json was not produced by restore for $($edition.Title)."
            }
            # Desktop (win channel) still ships LibreHardwareMonitor; Claw deliberately removed it.
            if ($edition.Channel -eq "win") {
              $assets = Get-Content $assetsPath -Raw | ConvertFrom-Json
              $resolved = $assets.libraries.PSObject.Properties.Name |
                Where-Object { $_ -like "LibreHardwareMonitorLib/*" } |
                Select-Object -First 1
              if (-not $resolved) {
                throw "LibreHardwareMonitorLib was not found in project.assets.json for $($edition.Title)."
              }
              Write-Host "Resolved $resolved"
            }

            dotnet build $proj -c Release --no-restore `
              -p:Version=$version `
              -p:AssemblyVersion=$version.0 `
              -p:FileVersion=$version.0 `
              -p:InformationalVersion=$version

            dotnet publish $proj `
              -c Release `
              -r win-x64 `
              --self-contained false `
              -p:Version=$version `
              -p:AssemblyVersion=$version.0 `
              -p:FileVersion=$version.0 `
              -p:InformationalVersion=$version `
              -p:PublishSingleFile=true `
              -p:PublishReadyToRun=false `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:DebugType=None `
              -p:DebugSymbols=false `
              -o $publishDir

            $exe = Join-Path $publishDir "OptiSensor.exe"
            if (-not (Test-Path $exe)) { throw "OptiSensor.exe not found after publish for $($edition.Title)." }

            & ".\.tools\vpk.exe" pack `
              --packId "OptiSensor" `
              --packVersion $version `
              --packDir $publishDir `
              --mainExe "OptiSensor.exe" `
              --packTitle "OptiSensor" `
              --packAuthors "onehoon" `
              --runtime "win-x64" `
              --framework "net10-x64-desktop" `
              --channel $edition.Channel `
              --icon (Join-Path $work "src/OptiSensor/Assets/OptiSensor.ico") `
              --outputDir $releaseDir

            $feed = Join-Path $releaseDir "releases.$($edition.Channel).json"
            if (-not (Test-Path $feed)) {
              throw "Expected Velopack channel feed was not produced: $feed"
            }
            Write-Host "Verified channel feed: $feed"

            git worktree remove --force $work
            Write-Host "::endgroup::"
          }

          if (-not (Get-ChildItem $releaseDir -Filter "*-Setup.exe" -File)) {
            throw "Velopack Setup.exe was not produced."
          }

      - name: Tag Velopack release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.version.outputs.tag }}"
          Write-Host "Version: ${{ steps.version.outputs.version }}"
          Write-Host "main commit: $(git rev-parse origin/main)"
          Write-Host "claw commit: $(git rev-parse origin/claw)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "OptiSensor $tag" origin/main
          git push origin $tag

      - name: Publish GitHub Release feed
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OptiSensor ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: .artifacts/release/*
