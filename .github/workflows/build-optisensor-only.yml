name: Build OptiSensor Only

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "OptiSensor edition to release"
        required: true
        type: choice
        options:
          - desktop
          - claw

permissions:
  contents: write

jobs:
  build:
    name: Build OptiSensor
    runs-on: windows-latest

    steps:
      - name: Resolve edition
        id: edition
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $edition = "${{ inputs.edition }}"

          switch ($edition) {
              "desktop" {
                  $sourceRef = "main"
                  $channel = "win"
                  $editionTitle = "Desktop"
              }
              "claw" {
                  $sourceRef = "claw"
                  $channel = "claw"
                  $editionTitle = "Claw"
              }
              default {
                  throw "Unsupported edition: $edition"
              }
          }

          "source_ref=$sourceRef" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "edition_title=$editionTitle" >> $env:GITHUB_OUTPUT
          Write-Host "Edition: $editionTitle"
          Write-Host "Source ref: $sourceRef"
          Write-Host "Channel: $channel"

      - name: Checkout OptiSensor
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.edition.outputs.source_ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Determine next OptiSensor version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --tags --force
          $patches = git tag -l "v0.1.*" | ForEach-Object {
            if ($_ -match '^v0\.1\.(\d+)$') { [int]$Matches[1] }
          }
          $nextPatch = if ($patches) { (($patches | Measure-Object -Maximum).Maximum + 1) } else { 1 }
          $version = "0.1.$nextPatch"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "OptiSensor version: $version"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\src\OptiSensor\OptiSensor.csproj `
            --force-evaluate `
            --no-http-cache

      - name: Show resolved LibreHardwareMonitor version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assetsPath = ".\src\OptiSensor\obj\project.assets.json"
          if (-not (Test-Path $assetsPath)) {
            throw "OptiSensor project.assets.json was not produced by restore."
          }

          $assets = Get-Content $assetsPath -Raw | ConvertFrom-Json
          $resolved = $assets.libraries.PSObject.Properties.Name |
            Where-Object { $_ -like "LibreHardwareMonitorLib/*" } |
            Select-Object -First 1
          if (-not $resolved) {
            throw "LibreHardwareMonitorLib was not found in project.assets.json."
          }

          Write-Host "Resolved $resolved"

      - name: Build OptiSensor
        run: dotnet build .\src\OptiSensor\OptiSensor.csproj -c Release --no-restore -p:Version=${{ steps.version.outputs.version }} -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 -p:FileVersion=${{ steps.version.outputs.version }}.0 -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Publish and package Velopack release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $channel = "${{ steps.edition.outputs.channel }}"
          $publishDir = Join-Path $env:GITHUB_WORKSPACE ".artifacts/publish"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE ".artifacts/release"
          dotnet publish .\src\OptiSensor\OptiSensor.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:Version=$version `
            -p:AssemblyVersion=$version.0 `
            -p:FileVersion=$version.0 `
            -p:InformationalVersion=$version `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=false `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $publishDir

          $exe = Join-Path $publishDir "OptiSensor.exe"
          if (-not (Test-Path $exe)) { throw "OptiSensor.exe not found after publish." }

          dotnet tool install vpk --tool-path .tools --version 1.2.0
          & ".\.tools\vpk.exe" pack `
            --packId "OptiSensor" `
            --packVersion $version `
            --packDir $publishDir `
            --mainExe "OptiSensor.exe" `
            --packTitle "OptiSensor" `
            --packAuthors "onehoon" `
            --runtime "win-x64" `
            --framework "net10-x64-desktop" `
            --channel $channel `
            --icon ".\src\OptiSensor\Assets\OptiSensor.ico" `
            --outputDir $releaseDir

          if (-not (Get-ChildItem $releaseDir -Filter "*-Setup.exe" -File)) {
            throw "Velopack Setup.exe was not produced."
          }

          $feed = Join-Path $releaseDir "releases.$channel.json"
          if (-not (Test-Path $feed)) {
            throw "Expected Velopack channel feed was not produced: $feed"
          }
          Write-Host "Verified channel feed: $feed"

      - name: Tag Velopack release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.version.outputs.tag }}"
          Write-Host "Edition: ${{ steps.edition.outputs.edition_title }}"
          Write-Host "Source ref: ${{ steps.edition.outputs.source_ref }}"
          Write-Host "Channel: ${{ steps.edition.outputs.channel }}"
          Write-Host "Version: ${{ steps.version.outputs.version }}"
          Write-Host "Commit: $(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "OptiSensor $tag"
          git push origin $tag

      - name: Publish GitHub Release feed
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OptiSensor ${{ steps.edition.outputs.edition_title }} ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: .artifacts/release/*
