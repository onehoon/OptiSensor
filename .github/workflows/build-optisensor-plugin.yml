name: Build OptiSensor plugin release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optisensor-plugin-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish rolling plugin release
    runs-on: windows-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Record checked-out build identity
        id: build-info
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sha = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') {
            throw "Could not determine the checked-out full Git SHA."
          }

          $runId = [UInt64]::Parse($env:GITHUB_RUN_ID, [Globalization.CultureInfo]::InvariantCulture)
          $header = @"
          #pragma once
          #define OPTISENSOR_BUILD_RUN_ID ${runId}ULL
          #define OPTISENSOR_BUILD_SHA "$sha"
          "@
          Set-Content -Path ".\src\OptiSensor.Plugin\OptiSensorBuildInfo.generated.h" -Value $header -Encoding utf8NoBOM
          "run_id=$runId" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Building checked-out main $sha in workflow run $runId."

      - name: Build Release x64 ASI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msbuild .\src\OptiSensor.Plugin\OptiSensor.Plugin.vcxproj /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "OptiSensor ASI build failed." }

      - name: Validate export and create single-file ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $asi = (Resolve-Path ".\src\OptiSensor.Plugin\bin\Release\OptiSensor.asi").Path

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = (& $vswhere -latest -products '*' -property installationPath).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $vsInstall) { throw "Could not locate the Visual Studio installation." }
          $dumpbin = Get-ChildItem (Join-Path $vsInstall "VC\Tools\MSVC") -Filter dumpbin.exe -Recurse |
            Where-Object { $_.FullName -like "*\bin\Hostx64\x64\dumpbin.exe" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw "Could not locate x64 dumpbin.exe." }

          $exports = (& $dumpbin /nologo /exports $asi | Out-String)
          if ($LASTEXITCODE -ne 0 -or $exports -notmatch '\bOptiPluginInit\b') {
            throw "OptiSensor.asi does not export OptiPluginInit."
          }

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $artifactDirectory = Join-Path (Get-Location) ".artifacts\plugin"
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          $zip = Join-Path $artifactDirectory "OptiSensor.zip"
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          $archive = [System.IO.Compression.ZipFile]::Open($zip, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
              $archive, $asi, "OptiSensor.asi", [System.IO.Compression.CompressionLevel]::Optimal) | Out-Null
          }
          finally { $archive.Dispose() }

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            if ($entries.Count -ne 1 -or $entries[0] -ne "OptiSensor.asi") {
              throw "OptiSensor.zip must contain exactly one root entry: OptiSensor.asi."
            }
          }
          finally { $archive.Dispose() }

          Write-Host "Validated OptiPluginInit export and ZIP entry: $($entries[0])"

      - name: Upload asset and publish rolling pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.build-info.outputs.run_id }}
          BUILD_SHA: ${{ steps.build-info.outputs.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "OptiSensor.Plugin"
          $releaseEndpoint = "repos/onehoon/OptiSensor/releases/tags/$tag"
          $releaseJson = $null
          $releaseExists = $false
          try {
            $releaseJson = gh api $releaseEndpoint 2>$null
            $releaseExists = $LASTEXITCODE -eq 0
          }
          catch {
            $releaseExists = $false
          }
          $releaseId = $null

          if ($releaseExists) {
            $releaseId = ($releaseJson | ConvertFrom-Json).id
          }
          else {
            $draftPath = Join-Path $env:RUNNER_TEMP "optisensor-release-draft.json"
            $draftPayload = @{
              tag_name = $tag
              name = "OptiSensor Plugin"
              body = ""
              draft = $true
              prerelease = $true
            } | ConvertTo-Json
            [System.IO.File]::WriteAllText($draftPath, $draftPayload, [System.Text.UTF8Encoding]::new($false))
            $releaseJson = gh api "repos/onehoon/OptiSensor/releases" --method POST --input $draftPath
            if ($LASTEXITCODE -ne 0) { throw "Could not create the draft rolling release." }
            $releaseId = ($releaseJson | ConvertFrom-Json).id
          }

          gh release upload $tag .\.artifacts\plugin\OptiSensor.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload OptiSensor.zip." }

          $assetIds = @(gh api "repos/onehoon/OptiSensor/releases/$releaseId/assets" --jq '.[] | select(.name != "OptiSensor.zip") | .id')
          if ($LASTEXITCODE -ne 0) { throw "Could not verify release assets." }
          foreach ($assetId in $assetIds) {
            if ($assetId) {
              gh api "repos/onehoon/OptiSensor/releases/assets/$assetId" --method DELETE
              if ($LASTEXITCODE -ne 0) { throw "Could not remove a stale release asset." }
            }
          }

          $assetNames = @(gh api "repos/onehoon/OptiSensor/releases/$releaseId/assets" --jq '.[].name')
          if ($LASTEXITCODE -ne 0 -or $assetNames.Count -ne 1 -or $assetNames[0] -ne "OptiSensor.zip") {
            throw "The rolling release does not contain exactly OptiSensor.zip."
          }

          $notes = @"
          Build-Run-ID: $env:BUILD_RUN_ID
          Build-SHA: $env:BUILD_SHA

          Windows x64 OptiScaler plugin. Extract OptiSensor.asi to the OptiScaler plugins folder and enable LoadAsiPlugins.
          Requires user-installed LibreHardwareMonitor v0.9.6, PawnIO, and its Remote Web Server enabled on port 8085. Verify http://127.0.0.1:8085/data.json returns sensor data.
          The ASI reads only the loopback endpoint and never installs, starts, elevates, or reconfigures LibreHardwareMonitor or PawnIO. Review remote access settings and Windows Firewall rules because the web server may listen beyond loopback.
          Source: https://github.com/onehoon/OptiSensor
          Plugin license: https://github.com/onehoon/OptiSensor/blob/main/src/OptiSensor.Plugin/LICENSE
          Includes yyjson 0.13.0, MIT license (Copyright 2020 YaoYuan): https://github.com/onehoon/OptiSensor/blob/main/third_party/yyjson/LICENSE
          "@
          $payloadPath = Join-Path $env:RUNNER_TEMP "optisensor-release.json"
          $payload = @{
            name = "OptiSensor Plugin"
            body = $notes.Trim()
            draft = $false
            prerelease = $true
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText($payloadPath, $payload, [System.Text.UTF8Encoding]::new($false))

          gh api "repos/onehoon/OptiSensor/releases/$releaseId" --method PATCH --input $payloadPath
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the updated rolling pre-release metadata." }
