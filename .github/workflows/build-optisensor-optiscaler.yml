name: Build OptiSensor Package

on:
  workflow_dispatch:
    inputs:
      optiscaler_ref:
        description: "OptiScaler branch, tag, or commit SHA"
        required: true
        default: "release/0.9"
      publish_release:
        description: "Upload package to GitHub Release"
        required: true
        type: boolean
        default: false

env:
  OPTISCALER_REPO: optiscaler/OptiScaler
  OPTISCALER_CONFIGURATION: Release
  OPTISCALER_PLATFORM: x64
  PACKAGE_PREFIX: OptiSensor

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout OptiSensor
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Capture OptiSensor commit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sensorCommit = git rev-parse HEAD
          "OPTISENSOR_COMMIT=$sensorCommit" >> $env:GITHUB_ENV
          Write-Host "OptiSensor commit: $sensorCommit"

      - name: Determine next OptiSensor version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --tags --force
          $patches = git tag -l "v0.1.*" | ForEach-Object {
            if ($_ -match '^v0\.1\.(\d+)$') { [int]$Matches[1] }
          }
          $nextPatch = if ($patches) { (($patches | Measure-Object -Maximum).Maximum + 1) } else { 1 }
          $version = "0.1.$nextPatch"
          "OPTISENSOR_VERSION=$version" >> $env:GITHUB_ENV
          "OPTISENSOR_TAG=v$version" >> $env:GITHUB_ENV

      - name: Prepare workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path ".work", ".artifacts/package", ".artifacts/dist" | Out-Null

      - name: Sanity check patch stack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $patchDir = Join-Path $env:GITHUB_WORKSPACE "optiscaler/patches"
          $patches = Get-ChildItem $patchDir -Filter "*.patch" | Sort-Object Name
          if ($patches.Count -eq 0) {
            throw "No OptiScaler patches found in optiscaler/patches."
          }

          $patchText = ($patches | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          if ($patchText -notmatch "FpsOverlay_JustFPSExternal") {
            throw "Patch stack does not appear to include the Just FPS external overlay type."
          }
          if ($patchText -notmatch "ExternalOverlayFeed") {
            throw "Patch stack does not appear to include the external overlay feed."
          }
          if ($patchText -notmatch "CustomOptional<bool> ShowFps \{ true \};") {
            throw "Patch stack does not default the FPS overlay to enabled."
          }

          Write-Host "Patch stack:"
          $patches | ForEach-Object { Write-Host " - $($_.Name)" }

      - name: Clone and checkout OptiScaler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $repo = "$env:OPTISCALER_REPO"
          $ref = "${{ inputs.optiscaler_ref }}"
          $repoUrl = "https://github.com/$repo.git"
          $cloneDir = Join-Path $env:GITHUB_WORKSPACE ".work/OptiScaler"

          function Invoke-Git {
            git @args
            if ($LASTEXITCODE -ne 0) {
              throw "git $args failed with exit code $LASTEXITCODE"
            }
          }

          function Resolve-GitCommit {
            param([Parameter(Mandatory = $true)][string] $revision)

            $output = git rev-parse --verify "$revision^{commit}"
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              throw "OptiScaler ref '$revision' could not be resolved to a commit (exit code $exitCode)."
            }

            return ($output | Out-String).Trim()
          }

          Invoke-Git clone $repoUrl $cloneDir
          Set-Location $cloneDir
          Invoke-Git fetch origin --tags --prune

          git ls-remote --exit-code --heads origin $ref | Out-Null
          $branchLookupExitCode = $LASTEXITCODE
          if ($branchLookupExitCode -eq 0) {
            $revision = "origin/$ref"
          }
          elseif ($branchLookupExitCode -eq 2) {
            $revision = $ref
          }
          else {
            throw "Unable to query OptiScaler ref '$ref' (exit code $branchLookupExitCode)."
          }

          $expectedCommit = Resolve-GitCommit $revision
          Invoke-Git checkout --detach $expectedCommit
          $checkedOutCommit = Resolve-GitCommit "HEAD"
          if ($checkedOutCommit -ne $expectedCommit) {
            throw "Checked-out OptiScaler commit '$checkedOutCommit' does not match requested ref '$ref' ('$expectedCommit')."
          }

          Invoke-Git submodule update --init --recursive

          $commit = (Invoke-Git rev-parse --short=12 HEAD).Trim()
          $fullCommit = Resolve-GitCommit "HEAD"
          "OPTISCALER_COMMIT=$commit" >> $env:GITHUB_ENV
          "OPTISCALER_FULL_COMMIT=$fullCommit" >> $env:GITHUB_ENV
          Write-Host "OptiScaler commit: $fullCommit"

      - name: Apply OptiScaler patches
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cloneDir = Join-Path $env:GITHUB_WORKSPACE ".work/OptiScaler"
          Set-Location $cloneDir
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $patches = Get-ChildItem "$env:GITHUB_WORKSPACE/optiscaler/patches" -Filter "*.patch" | Sort-Object Name
          if ($patches.Count -eq 0) {
            throw "No patches found. Patch stack is required."
          }

          foreach ($patch in $patches) {
            Write-Host "Applying $($patch.Name)"
            git am $patch.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Patch failed: $($patch.FullName)"
            }
          }

          git log --oneline -10

      - name: Build OptiScaler.vcxproj
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcxproj = Get-ChildItem "$env:GITHUB_WORKSPACE/.work/OptiScaler" -Recurse -Filter "OptiScaler.vcxproj" | Select-Object -First 1
          if (-not $vcxproj) {
            throw "OptiScaler.vcxproj not found"
          }

          "OPTISCALER_VCXPROJ=$($vcxproj.FullName)" >> $env:GITHUB_ENV
          Write-Host "Building $($vcxproj.FullName)"

          msbuild $vcxproj.FullName `
            /m `
            /p:Configuration=$env:OPTISCALER_CONFIGURATION `
            /p:Platform=$env:OPTISCALER_PLATFORM `
            /p:SolutionDir="$env:GITHUB_WORKSPACE\.work\OptiScaler\" `
            /p:PostBuildEventUseInBuild=false

      - name: Collect OptiScaler outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cloneDir = Join-Path $env:GITHUB_WORKSPACE ".work/OptiScaler"
          $packageDir = Join-Path $env:GITHUB_WORKSPACE ".artifacts/package"

          $config = "$env:OPTISCALER_CONFIGURATION"
          $platform = "$env:OPTISCALER_PLATFORM"
          $escapedConfig = [regex]::Escape($config)
          $escapedPlatform = [regex]::Escape($platform)

          $dll = Get-ChildItem $cloneDir -Recurse -Filter "OptiScaler.dll" |
            Where-Object {
              $_.FullName -match "\\$escapedPlatform\\" -and
              $_.FullName -match "\\$escapedConfig\\"
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $dll) {
            Write-Warning "No OptiScaler.dll found with both platform '$platform' and configuration '$config'. Falling back to relaxed path matching."
            $dll = Get-ChildItem $cloneDir -Recurse -Filter "OptiScaler.dll" |
              Where-Object {
                $_.FullName -match "\\$escapedPlatform\\" -or
                $_.FullName -match "\\$escapedConfig\\"
              } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
          }

          if (-not $dll) {
            throw "OptiScaler.dll not found after build"
          }

          $rootIni = Join-Path $cloneDir "OptiScaler.ini"
          if (Test-Path $rootIni) {
            $ini = Get-Item $rootIni
          }
          else {
            Write-Warning "Root OptiScaler.ini not found. Falling back to recursive search."
            $ini = Get-ChildItem $cloneDir -Recurse -Filter "OptiScaler.ini" |
              Sort-Object { $_.FullName.Length } |
              Select-Object -First 1
          }

          if (-not $ini) {
            $fallbackIni = Join-Path $env:GITHUB_WORKSPACE "optiscaler/OptiScaler.ini"
            if (Test-Path $fallbackIni) {
              Write-Warning "Using OptiSensor repository fallback OptiScaler.ini template."
              $ini = Get-Item $fallbackIni
            }
            else {
              throw "OptiScaler.ini not found after patching and no fallback template exists"
            }
          }

          Copy-Item $dll.FullName (Join-Path $packageDir "OptiScaler.dll") -Force
          Copy-Item $ini.FullName (Join-Path $packageDir "OptiScaler.ini") -Force

          "OPTISCALER_DLL=$($dll.FullName)" >> $env:GITHUB_ENV
          "OPTISCALER_INI=$($ini.FullName)" >> $env:GITHUB_ENV
          Write-Host "Collected DLL: $($dll.FullName)"
          Write-Host "Collected INI: $($ini.FullName)"

      - name: Publish OptiSensor helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $csproj = Join-Path $env:GITHUB_WORKSPACE "src/OptiSensor/OptiSensor.csproj"
          if (-not (Test-Path $csproj)) {
            throw "OptiSensor.csproj not found at $csproj"
          }

          $publishDir = Join-Path $env:GITHUB_WORKSPACE ".artifacts/optisensor-publish"
          dotnet publish $csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:Version=$env:OPTISENSOR_VERSION `
            -p:AssemblyVersion=$env:OPTISENSOR_VERSION.0 `
            -p:FileVersion=$env:OPTISENSOR_VERSION.0 `
            -p:InformationalVersion=$env:OPTISENSOR_VERSION `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=false `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $publishDir

          $exe = Join-Path $publishDir "OptiSensor.exe"
          if (-not (Test-Path $exe)) {
            throw "OptiSensor.exe not found after publish"
          }

          dotnet tool install vpk --tool-path .tools --version 1.2.0
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE ".artifacts/optisensor-release"
          & ".\.tools\vpk.exe" pack `
            --packId "OptiSensor" `
            --packVersion $env:OPTISENSOR_VERSION `
            --packDir $publishDir `
            --mainExe "OptiSensor.exe" `
            --packTitle "OptiSensor" `
            --packAuthors "onehoon" `
            --runtime "win-x64" `
            --framework "net10-x64-desktop" `
            --icon "$env:GITHUB_WORKSPACE\src\OptiSensor\Assets\OptiSensor.ico" `
            --outputDir $releaseDir

          $setup = Get-ChildItem $releaseDir -Filter "*-Setup.exe" -File | Select-Object -First 1
          if (-not $setup) { throw "Velopack Setup.exe was not produced." }
          Copy-Item $setup.FullName (Join-Path $env:GITHUB_WORKSPACE ".artifacts/package/OptiSensor-Setup.exe") -Force
          "OPTISENSOR_CSPROJ=$csproj" >> $env:GITHUB_ENV
          "OPTISENSOR_EXE=$exe" >> $env:GITHUB_ENV
          Write-Host "Published helper: $exe"

      - name: Create package zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ref = "${{ inputs.optiscaler_ref }}"
          $safeRef = $ref -replace '[\\/:*?"<>|]+', '-'
          $baseName = "$env:PACKAGE_PREFIX-$env:OPTISENSOR_VERSION-$safeRef-$env:OPTISCALER_COMMIT"
          $zipPath = Join-Path $env:GITHUB_WORKSPACE ".artifacts/dist/$baseName.zip"

          $requiredFiles = @("OptiScaler.dll", "OptiScaler.ini", "OptiSensor-Setup.exe")
          foreach ($file in $requiredFiles) {
            $path = Join-Path $env:GITHUB_WORKSPACE ".artifacts/package/$file"
            if (-not (Test-Path $path)) {
              throw "Package file missing: $file"
            }
          }

          Compress-Archive -Path "$env:GITHUB_WORKSPACE/.artifacts/package/*" -DestinationPath $zipPath -Force

          "PACKAGE_FILE_NAME_WITHOUT_EXT=$baseName" >> $env:GITHUB_ENV
          "PACKAGE_FILE_NAME=$baseName.zip" >> $env:GITHUB_ENV
          "PACKAGE_ZIP=$zipPath" >> $env:GITHUB_ENV
          "RELEASE_TAG=$env:OPTISENSOR_TAG" >> $env:GITHUB_ENV
          Write-Host "Package: $zipPath"
          Write-Host "Release tag: $env:OPTISENSOR_TAG"

      - name: Verify package contents
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $entries = [System.IO.Compression.ZipFile]::OpenRead($env:PACKAGE_ZIP).Entries | ForEach-Object { $_.FullName } | Sort-Object
          $entries | ForEach-Object { Write-Host " - $_" }
          $expected = @("OptiScaler.dll", "OptiScaler.ini", "OptiSensor-Setup.exe")
          $unexpected = @($entries | Where-Object { $expected -notcontains $_ })
          foreach ($file in $expected) {
            if ($entries -notcontains $file) {
              throw "Expected package entry missing: $file"
            }
          }
          if ($unexpected.Count -gt 0) {
            throw "Unexpected package entries: $($unexpected -join ', ')"
          }

      - name: Upload combined package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_FILE_NAME_WITHOUT_EXT }}
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error
          retention-days: 14

      - name: Tag Velopack release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $env:OPTISENSOR_TAG -m "OptiSensor $env:OPTISENSOR_TAG"
          git push origin $env:OPTISENSOR_TAG

      - name: Publish GitHub Release feed
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: false
          generate_release_notes: true
          files: .artifacts/optisensor-release/*

      - name: Upload combined package to GitHub Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: false
          files: |
            .artifacts/dist/*.zip
          body: |
            OptiSensor + patched OptiScaler package

            OptiScaler source:
            - Repository: ${{ env.OPTISCALER_REPO }}
            - Ref: ${{ inputs.optiscaler_ref }}
            - Commit: ${{ env.OPTISCALER_FULL_COMMIT }}

            OptiSensor patch stack:
            - Repository commit: ${{ env.OPTISENSOR_COMMIT }}

            Package:
            - ${{ env.PACKAGE_FILE_NAME }}

            Notes:
            - This package contains OptiScaler.dll, OptiScaler.ini, and the OptiSensor Velopack installer.
            - OptiScaler was patched using the patch stack stored in this OptiSensor repository.
