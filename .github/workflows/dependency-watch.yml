name: Dependency Watch

on:
  schedule:
    # Daily at 03:17 KST (18:17 UTC).
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: dependency-watch
  cancel-in-progress: false

jobs:
  check:
    name: Check Libre and HWiNFO wrapper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore latest floating dependencies
        shell: pwsh
        run: |
          dotnet restore ./src/OptiSensor/OptiSensor.csproj `
            -p:EnableWindowsTargeting=true `
            --force-evaluate `
            --no-http-cache

      - name: Resolve dependency versions
        id: versions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $assetsPath = "./src/OptiSensor/obj/project.assets.json"
          if (-not (Test-Path $assetsPath)) {
            throw "OptiSensor project.assets.json was not produced by restore."
          }

          $assets = Get-Content $assetsPath -Raw | ConvertFrom-Json
          $libreEntry = $assets.libraries.PSObject.Properties.Name |
            Where-Object { $_ -like "LibreHardwareMonitorLib/*" } |
            Select-Object -First 1
          if (-not $libreEntry) {
            throw "LibreHardwareMonitorLib was not found in project.assets.json."
          }
          $libreVersion = $libreEntry.Substring("LibreHardwareMonitorLib/".Length)

          [xml]$project = Get-Content "./src/OptiSensor/OptiSensor.csproj" -Raw
          $hwinfoReference = $project.Project.ItemGroup.PackageReference |
            Where-Object { $_.Include -eq "Hwinfo.SharedMemory.Net" } |
            Select-Object -First 1
          if (-not $hwinfoReference) {
            throw "Hwinfo.SharedMemory.Net PackageReference was not found."
          }
          $hwinfoCurrent = [string]$hwinfoReference.Version

          $packageId = "hwinfo.sharedmemory.net"
          $index = Invoke-RestMethod "https://api.nuget.org/v3-flatcontainer/$packageId/index.json"
          $stableVersions = $index.versions |
            Where-Object { $_ -notmatch "-" } |
            ForEach-Object {
              [pscustomobject]@{
                Text = [string]$_
                Parsed = [System.Management.Automation.SemanticVersion]$_
              }
            }
          if (-not $stableVersions) {
            throw "No stable Hwinfo.SharedMemory.Net versions were returned by NuGet."
          }
          $hwinfoLatest = ($stableVersions | Sort-Object Parsed | Select-Object -Last 1).Text
          $hwinfoUpdate = (
            [System.Management.Automation.SemanticVersion]$hwinfoLatest -gt
            [System.Management.Automation.SemanticVersion]$hwinfoCurrent
          )

          "libre=$libreVersion" >> $env:GITHUB_OUTPUT
          "hwinfo_current=$hwinfoCurrent" >> $env:GITHUB_OUTPUT
          "hwinfo_latest=$hwinfoLatest" >> $env:GITHUB_OUTPUT
          "hwinfo_update=$($hwinfoUpdate.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          Write-Host "LibreHardwareMonitorLib resolved: $libreVersion"
          Write-Host "Hwinfo.SharedMemory.Net current: $hwinfoCurrent"
          Write-Host "Hwinfo.SharedMemory.Net latest stable: $hwinfoLatest"

      - name: Check whether this Libre build already passed App CI
        id: libre-cache
        uses: actions/cache/restore@v6
        with:
          path: .ci-state/libre-built.txt
          key: optisensor-libre-built-${{ steps.versions.outputs.libre }}
          enableCrossOsArchive: true

      - name: Create Libre build update issue
        if: steps.libre-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LIBRE_VERSION: ${{ steps.versions.outputs.libre }}
        shell: bash
        run: |
          title="[Dependency] LibreHardwareMonitorLib ${LIBRE_VERSION} build"
          existing_count="$(
            gh issue list \
              --state all \
              --limit 100 \
              --json title |
              jq --arg title "$title" '[.[] | select(.title == $title)] | length'
          )"

          if [ "$existing_count" -gt 0 ]; then
            echo "An issue for LibreHardwareMonitorLib ${LIBRE_VERSION} already exists."
            exit 0
          fi

          body_file="${RUNNER_TEMP}/libre-build-update.md"
          cat > "$body_file" <<EOF
          @${GITHUB_REPOSITORY_OWNER}

          LibreHardwareMonitorLib ${LIBRE_VERSION} has no successful App CI marker.

          App CI and a release build were triggered automatically for this version.
          EOF

          gh issue create \
            --title "$title" \
            --body-file "$body_file"

      - name: Trigger App CI for a new Libre build
        if: steps.libre-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "LibreHardwareMonitorLib ${{ steps.versions.outputs.libre }} has no successful App CI marker."
          gh workflow run app-ci.yml --ref main

      - name: Trigger release build for a new Libre build
        if: steps.libre-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run build-optisensor-only.yml --ref main

      - name: Report unchanged Libre build
        if: steps.libre-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          echo "LibreHardwareMonitorLib ${{ steps.versions.outputs.libre }} already passed App CI."

      - name: Create HWiNFO wrapper update issue
        if: steps.versions.outputs.hwinfo_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ steps.versions.outputs.hwinfo_current }}
          LATEST_VERSION: ${{ steps.versions.outputs.hwinfo_latest }}
        shell: bash
        run: |
          title="[Dependency] Hwinfo.SharedMemory.Net ${LATEST_VERSION} available"
          existing_count="$(
            gh issue list \
              --state all \
              --limit 100 \
              --json title |
              jq --arg title "$title" '[.[] | select(.title == $title)] | length'
          )"

          if [ "$existing_count" -gt 0 ]; then
            echo "An issue for Hwinfo.SharedMemory.Net ${LATEST_VERSION} already exists."
            exit 0
          fi

          body_file="${RUNNER_TEMP}/hwinfo-wrapper-update.md"
          cat > "$body_file" <<EOF
          @${GITHUB_REPOSITORY_OWNER}

          A new stable Hwinfo.SharedMemory.Net version is available.

          - Current pinned version: \`${CURRENT_VERSION}\`
          - Latest stable version: \`${LATEST_VERSION}\`
          - NuGet package: https://www.nuget.org/packages/Hwinfo.SharedMemory.Net/${LATEST_VERSION}

          This workflow did not update the package reference or trigger App CI. Review compatibility and update it manually when appropriate.
          EOF

          gh issue create \
            --title "$title" \
            --body-file "$body_file"
